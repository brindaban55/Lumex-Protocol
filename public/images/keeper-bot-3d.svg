<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="botGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7E57C2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#7E57C2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#botGlow)"/>

  <!-- Orbital Rings -->
  <ellipse cx="300" cy="300" rx="200" ry="80" stroke="#00E599" stroke-width="2" stroke-dasharray="10 6" transform="rotate(-25 300 300)" opacity="0.6"/>
  <ellipse cx="300" cy="300" rx="180" ry="60" stroke="#3E7BFA" stroke-width="2" stroke-dasharray="8 4" transform="rotate(35 300 300)" opacity="0.7"/>

  <!-- Central Sentinel Sphere -->
  <circle cx="300" cy="300" r="90" fill="#0D1322" stroke="url(#orbGrad)" stroke-width="4" filter="url(#neonGlow)"/>
  <circle cx="300" cy="300" r="70" fill="#07090E"/>

  <!-- Sensor Core -->
  <circle cx="300" cy="300" r="35" fill="#00E599" opacity="0.9" filter="url(#neonGlow)"/>
  <circle cx="300" cy="300" r="18" fill="#FFFFFF"/>

  <!-- 1% Keeper Bounty Badge -->
  <g transform="translate(390, 200)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#7E57C2" stroke="#00E599" stroke-width="2" filter="url(#neonGlow)"/>
    <text x="65" y="26" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1% BOUNTY</text>
  </g>
</svg>
