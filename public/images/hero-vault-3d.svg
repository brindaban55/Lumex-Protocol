<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00B074" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3E7BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="300" r="220" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Isometric Platform Grid -->
  <g stroke="#00E599" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M400 120 L650 250 L400 380 L150 250 Z" fill="#0D1322" fill-opacity="0.8" />
    <path d="M400 380 L650 250 L650 310 L400 440 Z" fill="#07090E" fill-opacity="0.9" />
    <path d="M400 380 L150 250 L150 310 L400 440 Z" fill="#0A0E18" fill-opacity="0.9" />
  </g>

  <!-- Central 3D Soroban Smart Vault Cube -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M400 180 L520 245 L400 310 L280 245 Z" fill="url(#vaultGrad)" fill-opacity="0.75" stroke="#00E599" stroke-width="2"/>
    <!-- Left Face -->
    <path d="M280 245 L400 310 L400 430 L280 365 Z" fill="#0D1A2D" fill-opacity="0.85" stroke="#00E599" stroke-width="2"/>
    <!-- Right Face -->
    <path d="M400 310 L520 245 L520 365 L400 430 Z" fill="#071322" fill-opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <!-- Floating Stellar Lumens Energy Nodes -->
  <circle cx="280" cy="180" r="18" fill="#00E599" fill-opacity="0.85" filter="url(#glow)"/>
  <circle cx="520" cy="180" r="16" fill="#3B82F6" fill-opacity="0.85" filter="url(#glow)"/>
  <circle cx="400" cy="120" r="22" fill="#7E57C2" fill-opacity="0.9" filter="url(#glow)"/>

  <!-- Energy Stream Vectors -->
  <path d="M280 180 Q340 140 400 120" stroke="#00E599" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M520 180 Q460 140 400 120" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M400 120 L400 180" stroke="#00E599" stroke-width="3"/>

  <!-- Central Glyph -->
  <polygon points="400,225 385,255 400,250 395,275 415,245 400,250" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
